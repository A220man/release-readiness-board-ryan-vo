[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-readiness-board-ryan-vo"
version = "1.0.0"
description = "Evidence-backed release readiness with independent approval and deterministic risk diagnostics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"},
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app.core" = ["*.json"]
