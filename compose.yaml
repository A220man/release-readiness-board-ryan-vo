services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      COOKIE_SECURE: "true"
      DEMO_BIND_HOST: 0.0.0.0
      DATABASE_URL: sqlite:////data/release.db
    volumes:
      - release-data:/data
    expose: ["8000"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  release-data:
